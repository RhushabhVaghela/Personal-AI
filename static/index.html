<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PersonalAI Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0f1117;--panel:#171a23;--border:#2a2f3d;--fg:#e8eaf2;
    --muted:#9aa1b5;--accent:#7c6cf0;--ok:#4cc38a;--warn:#e5484d;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:var(--bg);
       color:var(--fg);height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:10px 16px;
         background:var(--panel);border-bottom:1px solid var(--border);
         flex-wrap:wrap}
  header h1{font-size:15px;margin:0;flex:1}
  select,input,button{font-size:13px}
  .badge{padding:3px 10px;border-radius:12px;font-size:12px;
         background:var(--border);color:var(--muted)}
  .badge.on{background:var(--warn);color:#fff}
  .badge.hf-on{background:var(--ok);color:#04110a}
  main{flex:1;display:flex;min-height:0}
  #chat{flex:1.4;display:flex;flex-direction:column;min-width:0}
  #log{flex:1;overflow-y:auto;padding:14px;display:flex;
       flex-direction:column;gap:8px}
  .msg{max-width:80%;padding:8px 12px;border-radius:12px;line-height:1.45;
       font-size:14px;white-space:pre-wrap}
  .you{align-self:flex-end;background:var(--accent);color:#fff;
       border-bottom-right-radius:4px}
  .bot{align-self:flex-start;background:var(--panel);
       border:1px solid var(--border);border-bottom-left-radius:4px}
  .sys{align-self:center;color:var(--muted);font-size:12px}
  #composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border)}
  #composer input{flex:1;background:var(--panel);border:1px solid var(--border);
                  color:var(--fg);border-radius:8px;padding:9px 12px;font-size:14px}
  button{background:var(--accent);color:#fff;border:0;border-radius:8px;
         padding:9px 14px;font-size:13px;cursor:pointer}
  button.sec{background:var(--panel);border:1px solid var(--border);color:var(--fg)}
  button.rec{background:var(--warn)}
  button.live{background:var(--ok);color:#04110a;font-weight:600}
  #side{width:320px;border-left:1px solid var(--border);display:flex;
        flex-direction:column}
  #shot{flex:1;background:#000;display:flex;align-items:center;
        justify-content:center;color:var(--muted);font-size:12px;overflow:hidden}
  #shot img{max-width:100%;max-height:100%}
  #side .row{padding:8px 10px;border-top:1px solid var(--border);
             display:flex;gap:6px}
  #tools{max-height:150px;overflow-y:auto;font-size:11px;color:var(--muted);
         padding:8px 10px;border-top:1px solid var(--border)}
  .tool-line{padding:2px 0;border-bottom:1px dashed var(--border)}
</style>
</head>
<body>
<header>
  <h1>★ PersonalAI Assistant</h1>
  <select id="provider">
    <option value="voicechat">Nemotron VoiceChat (speech-to-speech)</option>
    <option value="modular">Modular (ASR → LLM → TTS)</option>
    <option value="hybrid">Hybrid (VoiceChat + VLM)</option>
    <option value="qwen_omni">Qwen2.5-Omni (GPTQ-Int4 · smart S2S)</option>
    <option value="glm_voice">GLM-4-Voice (int4 · steerable emotion)</option>
    <option value="moshi">MoshiVis (q8 · realtime full-duplex + vision)</option>
  </select>
  <select id="profile" title="local = offline · online needs API keys in env">
    <option value="local">💻 Local (offline)</option>
    <option value="online-openai">☁ OpenAI</option>
    <option value="online-groq">☁ Groq</option>
  </select>
  <select id="voice" title="assistant voice">
    <option value="">🎙 Voice…</option>
    <option value="en-US-AriaNeural">Aria</option>
    <option value="en-US-JennyNeural">Jenny</option>
    <option value="en-US-GuyNeural">Guy</option>
    <option value="en-US-AnaNeural">Ana (cheerful)</option>
    <option value="en-GB-SoniaNeural">Sonia (UK)</option>
    <option value="en-IN-NeerjaNeural">Neerja (IN)</option>
    <option value="en-IN-PrabhatNeural">Prabhat (IN)</option>
  </select>
  <input type="range" id="speed" min="0.7" max="1.5" step="0.05" value="1"
         style="width:80px" title="speaking speed">
  <span class="badge" id="speedval">1.0×</span>
  <select id="effort" title="instant = fast local · deep = escalate to bigger model">
    <option value="instant">⚡ Instant</option>
    <option value="deep">🧠 Deep</option>
  </select>
  <span class="badge" id="status">connecting</span>
  <span class="badge" id="latency" title="turn latency"></span>
  <span class="badge hf-on" id="hf" style="display:none">👂 hands-free</span>
  <span class="badge" id="kill">kill-switch: off</span>
</header>
<main>
  <section id="chat">
    <div id="log"></div>
    <div id="composer">
      <input id="text-in" placeholder="Type, hold 🎙 to speak, or turn on 👂 hands-free…">
      <button id="mic" class="sec">🎙 Hold</button>
      <button id="hfbtn" class="sec">👂 Hands-free</button>
      <button id="wakebtn" class="sec" title="only respond to 'hey assistant'">📣 Wake word</button>
      <button id="sharebtn" class="sec" title="continuous screen share (Gemini-style)">🖥 Share screen</button>
      <button id="stopbtn" class="sec" style="display:none">⏹ Stop</button>
      <button id="send">Send</button>
    </div>
  </section>
  <aside id="side">
    <div id="shot">no screenshot yet</div>
    <div class="row">
      <button id="snap" class="sec" style="flex:1">📸 Screenshot</button>
      <button id="killbtn" class="sec" style="flex:1">🛑 Kill-switch</button>
    </div>
    <div class="row">
      <button id="newchat" class="sec" style="flex:1">🆕 New chat</button>
      <button id="transcriptbtn" class="sec" style="flex:1">🗒 Transcript</button>
      <button id="exportbtn" class="sec" style="flex:1">⬇ Export</button>
    </div>
    <div id="transcript" style="display:none;max-height:200px;overflow-y:auto;
         font-size:11px;padding:8px 10px;border-top:1px solid var(--border)">
    </div>
    <div id="tools"></div>
  </aside>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
let ws = null, recorder = null, chunks = [], hfOn = false;
/* ---- sequential audio queue: replies never overlap, like ChatGPT voice */
const audioQ = [];
let speaking = false;
function enqueueAudio(b64, fmt){
  audioQ.push({b64, fmt});
  pumpAudio();
}
function pumpAudio(){
  if(speaking || !audioQ.length) return;
  const {b64, fmt} = audioQ.shift();
  speaking = true;
  $("stopbtn").style.display = "";
  const mime = fmt === "mp3" ? "audio/mpeg" : "audio/wav";
  const a = new Audio(`data:${mime};base64,${b64}`);
  window.__currentAudio = a;
  a.onended = doneSpeaking;
  a.onerror = doneSpeaking;
  a.play().catch(doneSpeaking);
}
function doneSpeaking(){
  speaking = false;
  $("stopbtn").style.display = "none";
  if(audioQ.length) pumpAudio();
}
function stopSpeaking(){
  audioQ.length = 0;
  if(window.__currentAudio){ try{
    window.__currentAudio.pause(); }catch(e){} }
  doneSpeaking();
  ws.send(JSON.stringify({kind:"stop_speak"}));
}
function browserSpeak(text){
  /* used by online-groq profile (server raises BrowserTTSSignal) */
  if(!window.speechSynthesis) return false;
  stopSpeaking();
  const u = new SpeechSynthesisUtterance(text);
  u.onstart = () => { speaking = true; $("stopbtn").style.display = ""; };
  u.onend = doneSpeaking; u.onerror = doneSpeaking;
  speechSynthesis.speak(u);
  return true;
}
function logMsg(cls, text){
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = 1e9;
}
function connect(){
  ws = new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host+"/ws");
  ws.onopen = () => {
    $("status").textContent = "loading";
    ws.send(JSON.stringify({kind:"hello", provider:$("provider").value}));
  };
  // resync dropdowns to the SERVER's actual state on every ready message
  function syncDropdowns(current){
    if(current && $("provider").value !== current)
      $("provider").value = current;
  }
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    switch(m.kind){
      case "ready": $("status").textContent = "ready: "+m.provider;
        syncDropdowns(m.provider);
        logMsg("sys", "— "+m.provider+" ready —"); break;
      case "status": $("status").textContent = m.text;
        logMsg("sys", m.text); break;
      case "error": $("status").textContent = "error";
        logMsg("sys", "⚠ " + m.text); break;
      case "transcript": logMsg("you", m.text);
        tUser = performance.now(); break;
      case "reply": {
        logMsg("bot", m.text);
        if(m.text && m.text !== "(voice reply)") showCaption(m.text);
        if(tUser) $("latency").textContent =
          ((performance.now()-tUser)/1000).toFixed(1)+"s";
        break;
      }
      case "audio": enqueueAudio(m.data, m.format); break;
      case "backchannel": enqueueAudio(m.data, m.format); break;
      case "screenshot": $("shot").innerHTML =
        `<img src="data:image/png;base64,${m.image}">`; break;
      case "kill_state": setKill(m.engaged); break;
      case "tool": addToolLine(m.text); break;
      case "hands_free":
        hfOn = m.on;
        $("hf").style.display = m.on ? "" : "none";
        $("hfbtn").classList.toggle("live", m.on);
        $("hfbtn").textContent = m.on ? "👂 Listening…" : "👂 Hands-free";
        if(!m.on){ wakeOn = false;   // hands-free off ⇒ wake disarms
          $("wakebtn").classList.remove("live");
          $("wakebtn").textContent = "📣 Wake word"; }
        break;
      case "wake_mode":
        wakeOn = m.on;
        $("wakebtn").classList.toggle("live", m.on);
        $("wakebtn").textContent = m.on ? "📣 Armed" : "📣 Wake word";
        logMsg("sys", m.on ? "📣 wake-word armed — say \"hey assistant…\""
                           : "📣 wake word off");
        break;
      case "share_screen":
        shareOn = m.on;
        $("sharebtn").classList.toggle("live", m.on);
        $("sharebtn").textContent = m.on ? "🖥 Sharing…" : "🖥 Share screen";
        break;
      case "screen_stream": $("shot").innerHTML =
        `<img src="data:image/png;base64,${m.image}">`; break;
      case "voice_ok": $("status").textContent =
        `voice: ${m.voice.split("-").slice(2,3)[0]||m.voice} @ ${m.speed}×`;
        break;
      case "session": renderSession(m); break;
      case "card": showCard(m.card, m); break;
      case "vad": $("status").textContent = "listening…"; break;
    }
  };
  ws.onclose = () => { $("status").textContent = "disconnected";
    setTimeout(connect, 2000); };
}
/* captions overlay — Gemini auto-cc parity */
const capEl = document.createElement("div");
capEl.style.cssText = "position:fixed;bottom:18px;left:50%;transform:translateX(-50%);"+
  "max-width:70%;background:rgba(0,0,0,.75);color:#fff;padding:8px 16px;border-radius:10px;"+
  "font-size:15px;line-height:1.4;display:none;z-index:99;text-align:center";
document.body.appendChild(capEl);
let capTimer = null;
function showCaption(text){
  capEl.textContent = text;
  capEl.style.display = "block";
  clearTimeout(capTimer);
  capTimer = setTimeout(()=>capEl.style.display="none", Math.min(12000, 2500+text.length*55));
}
/* answer cards — GPT-Live visual widgets parity */
const cardEl = document.createElement("div");
cardEl.style.cssText = "position:fixed;top:64px;right:16px;width:230px;z-index:98;"+
  "display:none;flex-direction:column;gap:8px";
document.body.appendChild(cardEl);
function showCard(kind, d){
  let html = "";
  if(kind === "weather"){
    html = `<div style="background:linear-gradient(135deg,#3a5bd9,#7048c9);border-radius:14px;padding:12px 14px;color:#fff">
      <div style="font-size:26px;font-weight:700">${d.temp_c}°C</div>
      <div style="opacity:.9">${d.desc||""}</div>
      <div style="opacity:.75;font-size:12px">${d.location||""} · feels ${d.feels_c}° · 💧${d.humidity}%</div></div>`;
  } else if(kind === "clock"){
    html = `<div style="background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px">
      <div style="font-size:26px;font-weight:700">${d.time}</div>
      <div style="color:var(--muted);font-size:12px">${d.date||""}</div></div>`;
  } else if(kind === "reminder"){
    html = `<div style="background:#5a2d0c;border-radius:14px;padding:12px 14px;color:#ffd9a8">
      <div style="font-weight:600">⏰ Reminder set</div>
      <div style="font-size:13px;margin-top:2px">${(d.text||"").replace(/</g,"&lt;")}</div>
      <div style="opacity:.8;font-size:12px">due ${d.due}</div></div>`;
  } else return;
  const w = document.createElement("div");
  w.innerHTML = html;
  const node = w.firstChild;
  cardEl.prepend(node);
  cardEl.style.display = "flex";
  while(cardEl.children.length > 3) cardEl.lastChild.remove();
  setTimeout(()=>{ node.remove();
    if(!cardEl.children.length) cardEl.style.display="none"; }, 20000);
}
let tUser = 0;
function setKill(on){
  $("kill").textContent = "kill-switch: " + (on ? "ENGAGED" : "off");
  $("kill").classList.toggle("on", on);
}
let toolCount = 0;
function addToolLine(text){
  toolCount++;
  const d = document.createElement("div");
  d.className = "tool-line"; d.textContent = text;
  const panel = $("tools");
  if(toolCount === 1) panel.innerHTML = "";
  panel.appendChild(d);
  panel.scrollTop = 1e9;
}
async function startRec(){
  if(recorder && recorder.state === "recording") return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    // wait for the first real audio data before opening the recorder,
    // so ultra-short clicks never produce empty/corrupt webm chunks
    recorder = new MediaRecorder(stream);
    chunks = [];
    let gotData = false;
    recorder.ondataavailable = e => {
      if(e.data && e.data.size > 0){ chunks.push(e.data); gotData = true; }
    };
    recorder.onstop = () => {
      $("mic").classList.remove("rec"); $("mic").textContent = "🎙 Hold";
      if(!gotData || blobsSize() < 2000){
        logMsg("sys", "🎙 tap ignored (too short) — hold to speak");
        $("status").textContent = "ready";
        stream.getTracks().forEach(t => t.stop());
        return;
      }
      $("status").textContent = "sending audio...";
      logMsg("sys", "🎙 sent (" + (blobsSize()/1024).toFixed(0) + " KB)");
      const blob = new Blob(chunks, {type: recorder.mimeType});
      const fr = new FileReader();
      fr.onload = () => ws.send(JSON.stringify(
        {kind:"audio_chunk", data: fr.result.split(",")[1]}));
      fr.readAsDataURL(blob);
      stream.getTracks().forEach(t => t.stop());
    };
    recorder.start();
    $("mic").classList.add("rec"); $("mic").textContent = "⏹ Release";
    $("status").textContent = "recording...";
  }catch(err){ logMsg("sys", "mic error: " + err.message); }
}
function blobsSize(){ return chunks.reduce((a,c)=>a+c.size,0); }
function stopRec(){
  if(recorder && recorder.state === "recording"){
    if(blobsSize() === 0){ logMsg("sys","🎙 nothing recorded"); }
    recorder.stop();
  }
  $("mic").classList.remove("rec"); $("mic").textContent = "🎙 Hold";
}
$("mic").addEventListener("pointerdown", e => { e.preventDefault(); startRec(); });
$("mic").addEventListener("pointerup", stopRec);
$("mic").addEventListener("pointerleave", stopRec);
$("mic").style.userSelect = "none";
$("mic").style.touchAction = "none";
$("hfbtn").onclick = () => ws.send(JSON.stringify(
  {kind:"hands_free", on:!hfOn}));
let wakeOn = false;
$("wakebtn").onclick = () => {
  wakeOn = !wakeOn;
  $("wakebtn").classList.toggle("live", wakeOn);   // instant feedback
  ws.send(JSON.stringify({kind:"wake_mode", on:wakeOn}));
};
let shareOn = false;
$("sharebtn").onclick = () => {
  shareOn = !shareOn;
  $("sharebtn").classList.toggle("live", shareOn);
  ws.send(JSON.stringify({kind:"share_screen", on:shareOn}));
};
$("voice").onchange = () => ws.send(JSON.stringify(
  {kind:"set_voice", voice:$("voice").value}));
let speedTimer = null;
$("speed").oninput = () => {
  $("speedval").textContent = parseFloat($("speed").value).toFixed(2)+"×";
  clearTimeout(speedTimer);
  speedTimer = setTimeout(() => ws.send(JSON.stringify(
    {kind:"set_voice", speed:parseFloat($("speed").value)})), 400);
};
$("effort").onchange = () => ws.send(JSON.stringify(
  {kind:"set_effort", effort:$("effort").value}));
let nemotronVoiced = false;
const voT = document.createElement("label");
voT.style.cssText = "display:flex;align-items:center;gap:4px;font-size:12px;"+
  "color:var(--muted);cursor:pointer";
voT.innerHTML = `<input type="checkbox" id="voicechat-voice" style="accent-color:var(--accent)">
  <span title="Re-synthesize Nemotron replies with the selected voice/speed (needs internet, ~+1s)">voice on Nemotron</span>`;
$("effort").after(voT);
document.getElementById("voicechat-voice").onchange = e => {
  ws.send(JSON.stringify({kind:"set_voicechat_tts",
                          mode: e.target.checked ? "edge" : "native"}));
};
$("newchat").onclick = () => { $("log").innerHTML=""; toolCount=0;
  $("tools").innerHTML=""; ws.send(JSON.stringify(
  {kind:"session", action:"new"})); };
$("transcriptbtn").onclick = () => {
  const p = $("transcript");
  if(p.style.display === "none"){ p.style.display=""; p.innerHTML="loading…";
    ws.send(JSON.stringify({kind:"session", action:"transcript"})); }
  else p.style.display="none";
};
$("exportbtn").onclick = () => ws.send(JSON.stringify(
  {kind:"session", action:"export"}));
function renderSession(m){
  if(m.action !== "transcript") return;
  const p = $("transcript");
  let html = "";
  if(m.summary) html += `<div style="color:var(--accent);margin-bottom:6px">📌 summary kept</div>`;
  for(const t of (m.turns||[])){
    const who = t.role === "user" ? "🧑" : "🤖";
    html += `<div style="padding:2px 0;border-bottom:1px dashed var(--border)">
      ${who} ${t.text.replace(/</g,"&lt;").slice(0,140)}</div>`;
  }
  p.innerHTML = html || "empty conversation";
  p.scrollTop = 1e9;
}
$("stopbtn").onclick = stopSpeaking;
$("send").onclick = () => {
  const t = $("text-in").value.trim(); if(!t) return;
  logMsg("you", t);
  ws.send(JSON.stringify({kind:"text", text:t}));
  $("text-in").value = "";
};
$("text-in").addEventListener("keydown", e => {
  if(e.key === "Enter") $("send").click();
});
$("snap").onclick = () => ws.send(JSON.stringify({kind:"screenshot"}));
$("killbtn").onclick = () => ws.send(JSON.stringify({kind:"kill"}));
$("provider").onchange = () => {
  $("status").textContent = "switching...";
  ws.send(JSON.stringify({kind:"switch", provider:$("provider").value}));
};
$("profile").onchange = () => {
  $("status").textContent = "switching profile...";
  ws.send(JSON.stringify({kind:"switch_profile",
                          profile:$("profile").value}));
};
connect();
</script>
</body>
</html>
